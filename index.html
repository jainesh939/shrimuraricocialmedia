<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shri Murari Jewellers PVT. LTD.|Social Media Dashboard</title>
    <link rel="icon" type="image/png" href="../jewllers_pvt.ltd.-removebg-preview.png">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }
        
        .dashboard {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
            padding: 30px 20px;
            width: 100%;
            max-width: 500px;
            text-align: center;
        }
        
        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 2rem;
        }
        
        .social-buttons {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .social-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 20px;
            border-radius: 15px;
            color: white;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.1);
        }
        
        .social-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 20px rgba(0, 0, 0, 0.2);
        }
        
        .social-btn.youtube {
            background: linear-gradient(45deg, #FF0000, #CC0000);
        }
        
        .social-btn.facebook {
            background: linear-gradient(45deg, #4267B2, #365899);
        }
        
        .social-btn.instagram {
            background: linear-gradient(45deg, #833AB4, #E1306C, #F77737);
        }
        
        .social-btn i {
            font-size: 2rem;
            margin-right: 15px;
        }
        
        .social-btn span {
            font-size: 1.2rem;
            font-weight: 600;
        }
        
        .description {
            margin-top: 30px;
            color: #555;
            font-size: 1rem;
            line-height: 1.5;
        }
        
        .logo {
            margin-bottom: 25px;
        }
        
        .logo img {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 0;
        }
        
        /* For larger screens */
        @media (min-width: 768px) {
            .dashboard {
                max-width: 600px;
                padding: 40px;
            }
            
            h1 {
                font-size: 2.5rem;
                margin-bottom: 40px;
            }
            
            .social-buttons {
                flex-direction: row;
                justify-content: space-around;
                gap: 20px;
            }
            
            .social-btn {
                flex-direction: column;
                width: 150px;
                padding: 25px 15px;
            }
            
            .social-btn i {
                font-size: 2.5rem;
                margin-right: 0;
                margin-bottom: 15px;
            }
            
            .social-btn span {
                font-size: 1.1rem;
            }
            
            .description {
                font-size: 1.1rem;
                margin-top: 40px;
            }
        }
    </style>
</head>
<body>
    <div class="dashboard">
        <h1>Shri Murari Jewellers</h1>
        
        <div class="social-buttons">
            <a href="https://www.youtube.com/channel/UCmy_ir-N4CSi9zaf6N-ru_w" target="_blank" class="social-btn youtube">
                <i class="fab fa-youtube"></i>
                <span>YouTube</span>
            </a>
            
            <a href="https://www.facebook.com/ShriMurariJewellers/" target="_blank" class="social-btn facebook">
                <i class="fab fa-facebook-f"></i>
                <span>Facebook</span>
            </a>
            
            <a href="https://www.instagram.com/shrimurarijewellerspvtltd/" target="_blank" class="social-btn instagram">
                <i class="fab fa-instagram"></i>
                <span>Instagram</span>
            </a>
        </div>
        
        <div class="description">
            <p>Follow us on social media for the latest jewelry collections, offers, and updates!</p>
        </div>
        </div>
        <script>
            if ('serviceWorker' in navigator) {
                window.addEventListener('load', function() {
                    navigator.serviceWorker.register('service-worker.js');
                });
            }
        </script>
</body>

</html>
